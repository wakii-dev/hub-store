syntax = "proto3";

package hubstore.batching.v1;

import "hubstore/fulfillment/v1/fulfillment.proto";

option go_package = "hubstore/gen/go/hubstore/batching/v1;batchingv1";
option java_multiple_files = true;
option java_package = "com.hubstore.batching.v1";

// ============================================================================
// Envelope convention: same as fulfillment.proto (per-RPC Request/Response
// messages, NO shared wrapper; list responses carry items + total + page +
// page_size inline mapping to REST { items, total, page, pageSize }).
// Shared types (TimeRange, Product, OrderStatus) imported from
// hubstore.fulfillment.v1 — batching owns Batch/BatchingItem per spec §3.4.
// All datetimes are ISO-8601 strings.
//
// Owned by batching-service (Go, :50052) — spec §3.3: Go owns batches store.
// Mutations chain sang Java qua FulfillmentService.MutateOrderStatus.
// ============================================================================

// BatchEntityStatus — Trạng thái PHIẾU soạn hàng (spec §3.4; distinct from
// order-level BatchStatus 0-3).
enum BatchEntityStatus {
  BATCH_ENTITY_STATUS_ACTIVE = 0;    // Đang soạn
  BATCH_ENTITY_STATUS_COMPLETED = 1; // Hoàn tất
  BATCH_ENTITY_STATUS_CANCELLED = 2; // Đã hủy
}

// BatchingItem — 1 row trên D2 (REQUIREMENTS §4, field names GIỮ NGUYÊN).
message BatchingItem {
  // Mã phiếu soạn
  string batch_code = 1;
  // Thứ tự giao
  int32 stop_order = 2;
  // Mã đơn RSA
  string order_code = 3;
  string customer_address = 4;
  // Km
  double distance = 5;
  string from_delivery_time = 6;
  string to_delivery_time = 7;
  hubstore.fulfillment.v1.OrderStatus order_status = 8;
  int32 order_type = 9;
  repeated hubstore.fulfillment.v1.Product items = 10;
  int32 total_quantity = 11;
  // VND
  int64 cod_amount = 12;
}

// Batch — phiếu soạn hàng (spec §3.4, P1-1).
// Transitions: ACTIVE→COMPLETED (complete-picking), ACTIVE→CANCELLED (hủy).
message Batch {
  string batch_code = 1;
  string shop_code = 2;
  string shipper_id = 3;
  hubstore.fulfillment.v1.TimeRange delivery_time = 4;
  BatchEntityStatus status = 5;
  repeated BatchingItem items = 6;
  // ISO-8601 datetime
  string created_at = 7;
}

// PackingGroup — gợi ý nhóm đơn theo khoảng cách (D1b packing-suggest).
// Shape authored bởi SF-2 (REQUIREMENTS §4 không định nghĩa).
message PackingGroup {
  // Thứ tự trong group = thứ tự giao đề xuất.
  repeated string fulfill_codes = 1;
  double total_distance_km = 2;
}

// OrderDistance — kết quả recalculate-distance cho 1 đơn.
message OrderDistance {
  string fulfill_code = 1;
  double distance_km = 2;
}

service BatchingService {
  // D1b tạo phiếu: Go sinh batchCode + stopOrder, store batch, rồi gRPC→Java
  // MutateOrderStatus (đơn batchStatus NOT_PREPARED→PREPARING) — spec §3.3.
  rpc CreateBatch(CreateBatchRequest) returns (CreateBatchResponse);
  // D2 list.
  rpc FilterBatches(FilterBatchesRequest) returns (FilterBatchesResponse);
  // D2 detail / expand.
  rpc GetBatchDetail(GetBatchDetailRequest) returns (GetBatchDetailResponse);
  // Chỉ batch ACTIVE được hủy (rule 4 §3.6); đơn revert về NOT_PREPARED qua Java.
  rpc CancelBatch(CancelBatchRequest) returns (CancelBatchResponse);
  // Config trạng thái cho phép hủy = [ACTIVE] (spec §3.4).
  rpc GetBatchCriteria(GetBatchCriteriaRequest) returns (GetBatchCriteriaResponse);
  // "Hoàn tất soạn" D2: batch COMPLETED + đơn PREPARING→PREPARED qua Java (D11).
  rpc CompletePicking(CompletePickingRequest) returns (CompletePickingResponse);
  // Gợi ý nhóm đơn theo khoảng cách (D1b).
  rpc PackingSuggest(PackingSuggestRequest) returns (PackingSuggestResponse);
  // Tính lại km cho các đơn (D1b).
  rpc RecalculateDistance(RecalculateDistanceRequest) returns (RecalculateDistanceResponse);
}

message CreateBatchRequest {
  string shop_code = 1;
  string shipper_id = 2;
  hubstore.fulfillment.v1.TimeRange delivery_time = 3;
  // Thứ tự trong list = stop_order (D1b drag-drop sort).
  repeated string fulfill_codes = 4;
}

message CreateBatchResponse {
  Batch batch = 1;
}

message FilterBatchesRequest {
  // Số phiếu / Số đơn — text search (D2).
  string search = 1;
  // Trạng thái phiếu — multi-select.
  repeated BatchEntityStatus statuses = 2;
  // Thời gian tạo phiếu — date range (D2).
  hubstore.fulfillment.v1.TimeRange created_time = 3;
  // 1-based
  int32 page = 4;
  int32 page_size = 5;
}

message FilterBatchesResponse {
  repeated Batch items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetBatchDetailRequest {
  string batch_code = 1;
}

message GetBatchDetailResponse {
  Batch batch = 1;
}

message CancelBatchRequest {
  string batch_code = 1;
  // Lý do hủy (D2 confirm dialog).
  string reason = 2;
}

message CancelBatchResponse {
  // Batch sau khi hủy (status = CANCELLED).
  Batch batch = 1;
}

message GetBatchCriteriaRequest {
}

message GetBatchCriteriaResponse {
  // States cho phép hủy — spec §3.4: [BATCH_ENTITY_STATUS_ACTIVE].
  repeated BatchEntityStatus cancellable_statuses = 1;
}

message CompletePickingRequest {
  string batch_code = 1;
}

message CompletePickingResponse {
  Batch batch = 1;
}

message PackingSuggestRequest {
  string shop_code = 1;
  repeated string fulfill_codes = 2;
}

message PackingSuggestResponse {
  repeated PackingGroup groups = 1;
}

message RecalculateDistanceRequest {
  string shop_code = 1;
  repeated string fulfill_codes = 2;
}

message RecalculateDistanceResponse {
  repeated OrderDistance distances = 1;
}
