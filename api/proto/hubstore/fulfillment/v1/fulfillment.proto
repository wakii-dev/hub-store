syntax = "proto3";

package hubstore.fulfillment.v1;

option go_package = "hubstore/gen/go/hubstore/fulfillment/v1;fulfillmentv1";
option java_multiple_files = true;
option java_package = "com.hubstore.fulfillment.v1";

import "google/protobuf/timestamp.proto"; // SF-18 D2C (additive)

// ============================================================================
// Envelope convention (SF-2 contract decision, spec §3.1/§3.2):
// - NO shared wrapper response message. Every RPC owns its own
//   <Rpc>Request / <Rpc>Response pair (buf STANDARD lint:
//   RPC_REQUEST_RESPONSE_UNIQUE / RPC_RESPONSE_STANDARD_NAME).
// - List responses carry the pagination envelope INLINE as fields
//   `items` + `total` + `page` + `page_size`, mapping 1:1 to the REST
//   pagination envelope { items, total, page, pageSize } that the BFF emits.
// - All datetime/date-range values are ISO-8601 strings, matching
//   packages/shared TimeRange on the wire.
// - int64 amounts/counts (VND, totals) render as JS numbers (ts-proto
//   forceLong=number) — values are bounded well below 2^53.
// - Shared messages (TimeRange, Product, ShopAssignment, HubStoreOrderFilterItem,
//   OrderStatus/BatchStatus/CoordinationStatus enums) live in THIS file and are
//   imported by batching.proto. print.proto is standalone.
//
// Message shapes derive from REQUIREMENTS.md §4 (HubStoreOrderFilterItem,
// BatchingItem, Product) with wire codes mirroring packages/shared/src/enums.ts.
// Owned by SF-2 (FI-235); proto changes post-SPIKE-4 go through PM approval
// and require regenerating all 4 languages (spec §3.2).
// ============================================================================

// --- Status enums (wire codes mirror packages/shared/src/enums.ts) ---

// BatchStatus — Trạng thái soạn hàng (order-level, D1 filter + column).
enum BatchStatus {
  BATCH_STATUS_NOT_PREPARED = 0;    // Chưa soạn
  BATCH_STATUS_PREPARING = 1;       // Đang soạn
  BATCH_STATUS_PREPARED = 2;        // Đã soạn
  BATCH_STATUS_WEIGHT_EXCEEDED = 3; // Lỗi vượt trọng lượng (seed đặt tay)
}

// OrderStatus — Trạng thái đơn.
enum OrderStatus {
  ORDER_STATUS_PENDING_APPROVAL = 0; // Chờ duyệt
  ORDER_STATUS_APPROVED = 1;         // Đã duyệt
  ORDER_STATUS_REJECTED = 2;         // Từ chối duyệt
}

// CoordinationStatus — Trạng thái điều phối.
enum CoordinationStatus {
  COORDINATION_STATUS_PENDING = 0;   // Chờ điều phối
  COORDINATION_STATUS_IN_PROGRESS = 1; // Đang điều phối
  COORDINATION_STATUS_COMPLETED = 2;   // Hoàn tất điều phối
}

// RegionType — hierarchical region (D6: {code, name, type, parentCode?}).
enum RegionType {
  REGION_TYPE_PROVINCE = 0; // Tỉnh/TP
  REGION_TYPE_WARD = 1;     // Phường/Xã
}

// --- Shared messages ---

// TimeRange — ISO-8601 datetime strings (packages/shared TimeRange).
message TimeRange {
  string from = 1;
  string to = 2;
}

// Product — dòng sản phẩm trong items[] (REQUIREMENTS §4; shape chốt bởi SF-2).
message Product {
  string product_code = 1;
  string product_name = 2;
  int32 quantity = 3;
}

// ShopAssignment — kho CN xuất hàng (REQUIREMENTS §4 shopAssignment).
message ShopAssignment {
  string shop_code = 1;
  string shop_name = 2;
  string address = 3;
}

// Region — D6 hierarchical shape.
message Region {
  string code = 1;
  string name = 2;
  RegionType type = 3;
  // Set khi type = REGION_TYPE_WARD.
  optional string parent_code = 4;
}

// DeliveryStaff — shipper option cho DeliveryStaffSelect (D1b).
message DeliveryStaff {
  string id = 1;
  string name = 2;
  string shop_code = 3;
}

// Shop — option filter "Kho CN xuất hàng" (D1) / distinct shops.
message Shop {
  string code = 1;
  string name = 2;
  string address = 3;
}

// HubStoreOrderFilterItem — 1 row trên D1 (REQUIREMENTS §4, deep: gồm
// shopAssignment, times, items[] sản phẩm — D1 expand dùng filter response,
// KHÔNG gọi GetOrderDetail — spec §3.8).
message HubStoreOrderFilterItem {
  // Số đơn hàng (ORD-xxxx)
  string fulfill_code = 1;
  // Trạng thái điều phối
  CoordinationStatus status_code = 2;
  // Trạng thái soạn hàng (0-3)
  BatchStatus batch_status = 3;
  // Mã phiếu soạn (nếu có)
  optional string batch_code = 4;
  ShopAssignment shop_assignment = 5;
  // TG KH mong muốn
  TimeRange original_time = 6;
  // TG dự kiến giao
  TimeRange delivery_time = 7;
  // Trạng thái đơn (0-2)
  OrderStatus order_status = 8;
  // Danh sách sản phẩm (deep — D1 expand)
  repeated Product items = 9;
  // Tiền COD (VND)
  int64 cod_amount = 10;
  int32 total_quantity = 11;
  // Đơn chia nợ — không được chuyển kho (§9)
  bool is_debt_splitting_order = 12;
  string customer_address = 13;
  // Khoảng cách (km)
  optional double distance = 14;
  // Ghi chú — field thêm bởi SF-2 cho PUT /fulfillment/{code}/note
  // (spec §3.8: implement backend đầy đủ, KHÔNG có FE screen).
  optional string note = 15;
  // --- SF-13 intake/exception (additive, wire-safe; fields 21+ dành cho SF khác) ---
  string customer_name = 16;      // MỚI SF-13 — seed orders NULL → rỗng
  string customer_phone = 17;     // MỚI SF-13
  // Lý do giao thất bại (enum hubstore.intake.v1.DeliveryFailReason giữ dạng
  // STRING ở đây để KHÔNG import ngược intake.proto — additive string; rỗng = không fail)
  string fail_reason = 18;
  string fail_note = 19;
  // Đơn retry link về đơn gốc (đơn retry có giá trị; đơn gốc rỗng)
  string old_fulfill_code = 20;
}

// ShopAssignmentHistoryEntry — 1 entry lịch sử chuyển kho (D1c history view).
message ShopAssignmentHistoryEntry {
  string fulfill_code = 1;
  ShopAssignment from_shop = 2;
  ShopAssignment to_shop = 3;
  // ISO-8601 datetime
  string changed_at = 4;
  string changed_by = 5;
}

// --- FulfillmentService ---
// Owned by fulfillment-service (Java, :50051) — spec §3.3: CHỈ service này
// mutate order. Go batching gọi MutateOrderStatus / GetOrdersByCodes.

service FulfillmentService {
  // D1 list — filter + pagination. exclude_fulfill_codes = extension pin v1.
  rpc FilterOrders(FilterOrdersRequest) returns (FilterOrdersResponse);
  // GET /fulfillment/{fulfillCode} — sẵn sàng cho tương lai; D1 expand KHÔNG
  // gọi (waive tường minh, spec §3.8).
  rpc GetOrderDetail(GetOrderDetailRequest) returns (GetOrderDetailResponse);
  // Gọi bởi batching-service (Go): tạo/hủy/hoàn-tất phiếu → đổi batchStatus.
  rpc MutateOrderStatus(MutateOrderStatusRequest) returns (MutateOrderStatusResponse);
  // Hydration — Go gọi để validate rule 1 §3.6 (P0 fix: server-side thật).
  rpc GetOrdersByCodes(GetOrdersByCodesRequest) returns (GetOrdersByCodesResponse);
  // D1c chuyển kho.
  rpc AssignShopHub(AssignShopHubRequest) returns (AssignShopHubResponse);
  // POST /fulfillment/{code}/history — semantics là ĐỌC, không mutate (§3.8).
  rpc GetAssignHistory(GetAssignHistoryRequest) returns (GetAssignHistoryResponse);
  // Edit TG giao — chỉ hợp lệ khi batchStatus = 0 (validation rule 3 §3.6).
  rpc UpdateDeliveryTime(UpdateDeliveryTimeRequest) returns (UpdateDeliveryTimeResponse);
  // PUT /fulfillment/{code}/note — không có FE screen (§3.8).
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  // GET /master-data/regions — D6 hierarchical.
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);
  // GET /master-data/delivery-staff — DeliveryStaffSelect (D1b).
  rpc ListDeliveryStaff(ListDeliveryStaffRequest) returns (ListDeliveryStaffResponse);
  // GET /master-data/shops — options filter Kho CN (D1).
  rpc ListDistinctShops(ListDistinctShopsRequest) returns (ListDistinctShopsResponse);
  // GET /order-promising/time-delivery — hint TG giao cạnh DatePicker (D4, D1b).
  rpc GetTimeDelivery(GetTimeDeliveryRequest) returns (GetTimeDeliveryResponse);
  // GET /fulfillment/dashboard-stats (SF-9) — aggregate 30 ngày + hôm nay.
  rpc GetDashboardStats(GetDashboardStatsRequest) returns (GetDashboardStatsResponse);
  // SF-18: D2C/Dropship list — filter đa chiều + pagination.
  rpc FilterD2cOrders(FilterD2cOrdersRequest) returns (FilterD2cOrdersResponse);
  // SF-18: PUT /d2c-orders/{orderCode}/note — note khóa order_code.
  rpc UpdateD2cOrderNote(UpdateD2cOrderNoteRequest) returns (UpdateD2cOrderNoteResponse);
  // SF-14: confirm thu COD per-order (mỗi item 1 result — fail không kill batch).
  rpc ConfirmCod(ConfirmCodRequest) returns (ConfirmCodResponse);
  // SF-14: confirm thu COD cả phiếu (chỉ PENDING, đơn FAILED loại — D7).
  rpc ConfirmBatchCod(ConfirmBatchCodRequest) returns (ConfirmBatchCodResponse);
  // SF-14: badge D2 "COD chờ thu (n)" theo phiếu (D7).
  rpc GetCodPending(GetCodPendingRequest) returns (GetCodPendingResponse);
  // SF-14: đối soát theo shop theo kỳ (GROUP BY SQL — D5).
  rpc GetSettlement(GetSettlementRequest) returns (GetSettlementResponse);
  // SF-14: drill-down đơn theo shop + kỳ (lệch tiền / chưa thu).
  rpc GetSettlementDetail(GetSettlementDetailRequest) returns (GetSettlementDetailResponse);
  // SF-21: danh sách máy in theo kho (DB-backed — V8) cho D3 print.
  rpc ListPrinters(ListPrintersRequest) returns (ListPrintersResponse);
  // SF-21: tạo máy in (Admin — BFF gate, spec D9).
  rpc CreatePrinter(CreatePrinterRequest) returns (CreatePrinterResponse);
  // SF-21: sửa máy in — (shop_code, printer_id) immutable, chỉ name/ip/mac/type.
  rpc UpdatePrinter(UpdatePrinterRequest) returns (UpdatePrinterResponse);
  // SF-21: ghi nhận 1 lỗi in thật (BFF record trên failure path — spec D2).
  rpc RecordPrintError(RecordPrintErrorRequest) returns (RecordPrintErrorResponse);
  // SF-21: đếm lỗi in per đơn theo phiếu — badge + sort D3 (V9).
  rpc GetPrintErrorCounts(GetPrintErrorCountsRequest) returns (GetPrintErrorCountsResponse);
}

// --- Filter ---

// 8 filter fields của D1 + extension + pagination.
message FilterOrdersRequest {
  // Số đơn hàng — text search
  string fulfill_code = 1;
  // Trạng thái soạn hàng — multi-select
  repeated BatchStatus batch_statuses = 2;
  // Thời gian dự kiến giao — datetime range
  TimeRange delivery_time = 3;
  // Địa chỉ — multi-select (tỉnh/phường, Region.code)
  repeated string region_codes = 4;
  // Kho CN xuất hàng — multi-select (Shop.code)
  repeated string shop_codes = 5;
  // Trạng thái đơn — multi-select
  repeated OrderStatus order_statuses = 6;
  // Thời gian tạo đơn — date range
  TimeRange created_time = 7;
  // Thời gian KH mong muốn — datetime range
  TimeRange original_time = 8;
  // Extension pin v1 (spec §3.1): loại trừ các đơn đã chọn khi thêm đơn vào phiếu.
  repeated string exclude_fulfill_codes = 9;
  // 1-based
  int32 page = 10;
  int32 page_size = 11;
}

message FilterOrdersResponse {
  // Deep items (HubStoreOrderFilterItem) — D1 expand đọc từ đây.
  repeated HubStoreOrderFilterItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Detail / hydration / mutation ---

message GetOrderDetailRequest {
  string fulfill_code = 1;
}

message GetOrderDetailResponse {
  HubStoreOrderFilterItem order = 1;
}

// Mutation one-way từ batching-service (spec §3.3). target_batch_status là
// trạng thái soạn hàng MỚI của các đơn.
message MutateOrderStatusRequest {
  repeated string fulfill_codes = 1;
  BatchStatus target_batch_status = 2;
  // Lý do (vd hủy phiếu) — optional.
  optional string reason = 3;
  // Mã phiếu soạn — Go batching truyền qua để Java eager-insert cod_confirmations đúng batch.
  optional string batch_code = 4;
}

message MutateOrderStatusResult {
  string fulfill_code = 1;
  bool success = 2;
  string message = 3;
}

message MutateOrderStatusResponse {
  repeated MutateOrderStatusResult results = 1;
}

// Hydration cho Go validate rule 1 §3.6: lấy truth từ Java, reject nếu KHÔNG
// cùng kho hoặc tồn tại đơn batch_status ≠ BATCH_STATUS_NOT_PREPARED.
message GetOrdersByCodesRequest {
  repeated string fulfill_codes = 1;
}

message GetOrdersByCodesResponse {
  repeated HubStoreOrderFilterItem orders = 1;
}

// --- Chuyển kho (D1c) + history ---

message AssignShopHubRequest {
  string fulfill_code = 1;
  string target_shop_code = 2;
}

message AssignShopHubResponse {
  // Order sau khi chuyển (shop_assignment cập nhật).
  HubStoreOrderFilterItem order = 1;
}

// READ semantics (POST trên REST nhưng không mutate — spec §3.8).
message GetAssignHistoryRequest {
  string fulfill_code = 1;
}

message GetAssignHistoryResponse {
  repeated ShopAssignmentHistoryEntry entries = 1;
}

// --- Edit TG giao / ghi chú ---

message UpdateDeliveryTimeRequest {
  string fulfill_code = 1;
  TimeRange delivery_time = 2;
}

message UpdateDeliveryTimeResponse {
  HubStoreOrderFilterItem order = 1;
}

message UpdateNoteRequest {
  string fulfill_code = 1;
  string note = 2;
}

message UpdateNoteResponse {
  HubStoreOrderFilterItem order = 1;
}

// --- Master data / order-promising ---

message ListRegionsRequest {
}

message ListRegionsResponse {
  repeated Region regions = 1;
}

// shop_code trống = tất cả; điền = lọc theo kho.
message ListDeliveryStaffRequest {
  optional string shop_code = 1;
}

message ListDeliveryStaffResponse {
  repeated DeliveryStaff items = 1;
}

message ListDistinctShopsRequest {
}

message ListDistinctShopsResponse {
  repeated Shop items = 1;
}

// D4 hint TG giao (D1b, cạnh DatePicker).
message GetTimeDeliveryRequest {
  string shop_code = 1;
  string customer_address = 2;
}

message GetTimeDeliveryResponse {
  TimeRange suggested_time = 1;
}

// --- Dashboard (SF-9, FI-245) — aggregate thuần fulfillment DB. TZ cố định
// Asia/Ho_Chi_Minh cho date grouping; window 30 ngày cố định, không param.
message GetDashboardStatsRequest {
}

message DayCount {
  // YYYY-MM-DD (TZ Asia/Ho_Chi_Minh)
  string date = 1;
  int32 count = 2;
}

message BatchOrderCount {
  string batch_code = 1;
  int32 count = 2;
}

message GetDashboardStatsResponse {
  // Đủ 30 ô cũ→mới (ngày thiếu = 0), nhóm theo original_time_from.
  repeated DayCount orders_per_day = 1;
  // Đơn original_time_from trong hôm nay (TZ Asia/Ho_Chi_Minh).
  int32 total_today = 2;
  // order_status = ORDER_STATUS_PENDING_APPROVAL.
  int32 pending_approval = 3;
  // Đơn ĐÃ vào phiếu: GROUP BY batch_code (batch_code ≠ '').
  repeated BatchOrderCount orders_per_batch = 4;
}

// --- SF-18 D2C/Dropship (additive only) ---
message D2cOrder {
  string order_code = 1;
  string order_id_inter = 2;
  string delivery_id = 3;
  string carrier = 4;
  string shop = 5;
  string export_employee = 6;
  google.protobuf.Timestamp export_time = 7;
  google.protobuf.Timestamp push_time = 8;
  string receiver_name = 9;
  string receiver_phone = 10;
  string receiver_address = 11;
  string service_type = 12;
  string product_category = 13;
  string product_type = 14;
  bool is_debt_splitting = 15;
  string note = 16;
  string status = 17;
  google.protobuf.Timestamp created_at = 18;
  int64 id = 19;
}

message FilterD2cOrdersRequest {
  string search = 1;                 // orderCode/deliveryId LIKE
  repeated string statuses = 2;
  repeated string carriers = 3;
  repeated string shops = 4;
  repeated string export_employees = 5;
  string product_category = 6;
  string product_type = 7;
  google.protobuf.Timestamp created_from = 8;
  google.protobuf.Timestamp created_to = 9;
  google.protobuf.Timestamp push_from = 10;
  google.protobuf.Timestamp push_to = 11;
  string push_slot_from = 12;        // "HH:mm" time-of-day VN
  string push_slot_to = 13;
  int32 page = 14;
  int32 page_size = 15;
}

message FilterD2cOrdersResponse {
  repeated D2cOrder items = 1;
  int64 total = 2;
}

message UpdateD2cOrderNoteRequest {
  string order_code = 1;
  string note = 2;
  string actor_role = 3;
}
message UpdateD2cOrderNoteResponse {
  D2cOrder order = 1;
}

// --- SF-14 COD settlement (FI-259, additive only) ---

// Trạng thái thu COD (wire codes mirror cod_confirmations.status: 0 = PENDING).
enum CodCollectionStatus {
  COD_PENDING = 0;
  COD_CONFIRMED = 1;
}

// 1 dòng cod_confirmations — snapshot pattern: expected/shop_name chụp lúc
// hoàn tất phiếu; completed_at là anchor kỳ đối soát (D1).
message CodConfirmation {
  string fulfill_code = 1;
  string batch_code = 2;
  string shop_code = 3;
  string shop_name = 4;
  // Snapshot cod_amount lúc hoàn tất (VND).
  int64 expected_amount = 5;
  // optional presence (D3 — precedent Region.parent_code): absence = PENDING
  // (chưa thu); presence 0 = thu thật 0 đồng (KHÔNG dùng sentinel).
  optional int64 collected_amount = 6;
  string collected_by = 7;
  google.protobuf.Timestamp collected_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  CodCollectionStatus status = 10;
}

// Per-order confirm — collected_amount absence = lấy expected (D3).
message ConfirmCodItem {
  string fulfill_code = 1;
  optional int64 collected_amount = 2;
}

message ConfirmCodRequest {
  repeated ConfirmCodItem items = 1;
}

message ConfirmCodResult {
  string fulfill_code = 1;
  bool success = 2;
  string message = 3;
}

message ConfirmCodResponse {
  repeated ConfirmCodResult results = 1;
}

message ConfirmBatchCodRequest {
  string batch_code = 1;
}

message ConfirmBatchCodResponse {
  int32 confirmed_count = 1;
  // Tổng thu được (mỗi đơn collected = expected — bulk confirm).
  int64 total_amount = 2;
}

message GetCodPendingRequest {
  string batch_code = 1;
}

message GetCodPendingResponse {
  int32 pending_count = 1;
  int64 total_amount = 2;
}

// Kỳ [from, to) trên completed_at — BFF wrap full-day +07:00 (D9).
message GetSettlementRequest {
  google.protobuf.Timestamp period_from = 1;
  google.protobuf.Timestamp period_to = 2;
  // Điền = lọc 1 shop; trống = tất cả.
  optional string shop_code = 3;
}

message SettlementShopRow {
  string shop_code = 1;
  string shop_name = 2;
  int32 total_orders = 3;
  int64 total_expected = 4;
  int64 total_collected = 5;
  int64 diff_amount = 6;
  int32 pending_count = 7;
  // CONFIRMED nhưng collected ≠ expected (thu lệch — D3 case 0 đồng).
  int32 mismatch_count = 8;
}

message GetSettlementResponse {
  repeated SettlementShopRow rows = 1;
}

message GetSettlementDetailRequest {
  string shop_code = 1;
  google.protobuf.Timestamp period_from = 2;
  google.protobuf.Timestamp period_to = 3;
}

message GetSettlementDetailResponse {
  repeated CodConfirmation confirmations = 1;
}

// --- SF-21 printer management (additive only) ---

// Printer — 1 máy in của kho (bảng printers, V8). (shop_code, printer_id) là
// identity — KHÔNG sửa sau tạo (spec D9). type là STRING ('bill' | 'a4') —
// tránh enum churn (lint rule như buf.yaml chú thích), validation ở Java.
message Printer {
  string shop_code = 1;
  string printer_id = 2;
  string name = 3;
  string printer_ip = 4;
  string mac = 5;
  string type = 6;
  // Review-nhóm-2 P1: spec D9 — location editable (seed "Khu soạn A"...).
  string location = 7;
}

message ListPrintersRequest {
  // shop_code trống = tất cả (BFF luôn truyền shop — defensive như print-service).
  string shop_code = 1;
}

message ListPrintersResponse {
  repeated Printer printers = 1;
}

message CreatePrinterRequest {
  Printer printer = 1;
}

message CreatePrinterResponse {
  Printer printer = 1;
}

message UpdatePrinterRequest {
  string shop_code = 1;
  string printer_id = 2;
  // Chỉ name/printer_ip/mac/type có hiệu lực — identity lấy từ 2 field path.
  Printer printer = 3;
}

message UpdatePrinterResponse {
  Printer printer = 1;
}

// --- SF-21 print errors (additive only, spec D2) ---

// PrintErrorRecord — 1 lỗi in thật. BFF ghi qua rpc này; order_code rỗng
// khi batch chưa hydrate được (lỗi xảy ra trước khi biết danh sách đơn).
message PrintErrorRecord {
  string order_code = 1;
  string batch_code = 2;
  string print_type = 3;
  string printer_id = 4;
  string error_message = 5;
}

message RecordPrintErrorRequest {
  PrintErrorRecord record = 1;
}

message RecordPrintErrorResponse {
}

// PrintErrorCount — số lỗi in của 1 đơn trong phiếu (badge D3).
message PrintErrorCount {
  string order_code = 1;
  int64 count = 2;
}

message GetPrintErrorCountsRequest {
  string batch_code = 1;
}

message GetPrintErrorCountsResponse {
  repeated PrintErrorCount counts = 1;
}
