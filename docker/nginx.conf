# SF-11 compose mẫu — nginx phục vụ shell (root) + 2 remotes + proxy /api → bff.
server {
  listen 3000;

  # SF-2: k8s health probe endpoint (SF-4 wiring manifest) — no access_log spam.
  location /healthz {
    return 200 'ok';
    access_log off;
  }

  # SF-23: manifest MIME — mime.types của nginx:1.27-alpine chưa có
  # manifest+json (đã kiểm). types block scoped trong exact-match location này
  # để KHÔNG wipe mime.types mặc định của location / (JS/CSS/HTML).
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    types { application/manifest+json webmanifest; }
  }

  # Shell SPA (BrowserRouter → fallback index.html)
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Remote static (remoteEntry.js ở dist root — SPIKE 1 verdict)
  location /remotes/orders/ {
    alias /remotes/orders/;
  }
  location /remotes/fulfillment/ {
    alias /remotes/fulfillment/;
  }

  # API cùng origin → bff (strip /api; axios baseURL=/api lúc build)
  location /api/ {
    proxy_pass http://bff:8080/;
    proxy_set_header Host $host;
  }
}
