# fulfillment-service (SF-3) — standalone gRPC server, KHÔNG thuộc turbo.
spring:
  application:
    name: fulfillment-service
  main:
    web-application-type: none
  kafka:
    # SF-27 (FI-273) — side-channel best-effort; flag off = KHÔNG connect.
    # Timeouts ngắn: kafka chết → send fail nhanh, KHÔNG block 60s default.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
  datasource:
    # SF-2 (FI-245): Postgres qua env (compose/dev override FULFILLMENT_DB_*).
    url: jdbc:postgresql://${FULFILLMENT_DB_HOST:localhost}:${FULFILLMENT_DB_PORT:5432}/${FULFILLMENT_DB_NAME:fulfillment}
    username: ${FULFILLMENT_DB_USER:hubstore}
    password: ${FULFILLMENT_DB_PASSWORD:}
    hikari:
      # Spec §6.1 today-default: Asia/Ho_Chi_Minh — Postgres session TZ mặc định
      # UTC làm CURRENT_DATE / expected_time::date lệch ngày từ 00:00–06:59 VN.
      connection-init-sql: SET timezone='Asia/Ho_Chi_Minh'
  flyway:
    # Migrate-on-boot: V1__orders_schema.sql tự áp khi service start.
    enabled: true
    # SF-13: V2__intake_schema có version NHỎ HƠN watermark khi SF-7 đã áp V5
    # (dev DB dùng chung) — không bật out-of-order thì Flyway IM LẶNG skip V2
    # mỗi boot thường → orders thiếu 7 cột intake → crash runtime.
    out-of-order: true

grpc:
  server:
    # Spec §3.3: :50051 — override qua env GRPC_FULFILLMENT.
    port: ${GRPC_FULFILLMENT:50051}

fulfillment:
  # Nguồn dữ liệu duy nhất: api/seed/canonical-seed.json (SF-2 authored).
  # Rỗng = auto-resolve (README): SEED_PATH > ../../api/seed > ../api/seed > api/seed.
  seed-path: ${SEED_PATH:}

kafka:
  # SF-27 — event bus flag (env KAFKA_ENABLED; false → NoopEventPublisher).
  enabled: ${KAFKA_ENABLED:false}

payment:
  verify:
    # SF-17: chọn PaymentAccountVerifier — mock (default) | zalopay.
    # zalopay yêu cầu env ZALOPAY_APP_ID/ZALOPAY_KEY1 (fail-loud lúc boot nếu thiếu).
    provider: ${PAYMENT_VERIFY_PROVIDER:mock}

webhook:
  # SF-26 (FI-271) — ngưỡng stale reclaim claim webhook (giây): PENDING cũ hơn
  # ngưỡng = crash mồ côi → reclaim + xử lý lại; PENDING mới → UNAVAILABLE.
  claim-stale-seconds: ${WEBHOOK_CLAIM_STALE_SECONDS:120}

# SF-12 (FI-257) — s2s auth (token passthrough, spec §3.1 CONTRACT):
#   - oidc.issuer  = giá trị claim `iss` trong JWT (localhost dev);
#   - oidc.jwks-url = URL mạng THẬT fetch JWKS (trong compose là http://keycloak:8081 —
#     KHÔNG derive từ issuer — same gotcha BFF compose);
#   - auth.internal-service-token = machine-call credential (Go→Java, reconciler).
# Fail-closed: thiếu cả user JWT hợp lệ lẫn internal token → PERMISSION_DENIED.
oidc:
  issuer: ${OIDC_ISSUER:}
  jwks-url: ${OIDC_JWKS_URL:}
auth:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
