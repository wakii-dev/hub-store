# FI-245 SF-1 — docker-compose cấu hình MẪU chạy local (KHÔNG prod deploy).
# 4 service images (java/go/python/node) + nginx static shell/2 remotes
# (publicPath prod theo SPIKE 1 verdict: remoteEntry ở dist root, chunks
# import tương đối → mỗi remote phục vụ dưới /remotes/<name>/ với --base riêng).
#
#   docker compose up --build
#   → mở http://localhost:3000
#
# Persistence: postgres (2 DB: fulfillment + batching, initdb qua
# docker/postgres/initdb/) ← migrate one-shot (orders-migrate Flyway SF-2,
# batches-migrate golang-migrate SF-3) ← db-seed (scripts/seed-db.sh,
# emptiness-gate) ← app services. Env contract: xem .env.example.
name: hub-store

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hubstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env (local-only, xem .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot migrate — schema do SF-2/SF-3 sở hữu trong service dir; SF-1 chỉ wire.
  orders-migrate: # Flyway CLI → DB fulfillment (SF-2: services/fulfillment-service/src/main/resources/db/migration)
    image: flyway/flyway:10.20.1
    command: >-
      -url=jdbc:postgresql://postgres:5432/fulfillment
      -user=${POSTGRES_USER:-hubstore}
      -password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      -connectRetries=10
      -locations=filesystem:/migrations
      migrate
    volumes:
      - ./services/fulfillment-service/src/main/resources/db/migration:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  batches-migrate: # golang-migrate CLI → DB batching (SF-3: services/batching-service/migrations)
    image: migrate/migrate:v4.17.1
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-hubstore}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}@postgres:5432/batching?sslmode=disable",
        "up",
      ]
    volumes:
      - ./services/batching-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot seed cả 2 DB — cùng script với standalone dev flow (scripts/seed-db.sh).
  db-seed:
    image: postgres:16.4
    entrypoint: ["bash", "/scripts/seed-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-hubstore}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      POSTGRES_USER: ${POSTGRES_USER:-hubstore}
      SEED_JSON: /seed/canonical-seed.json
    volumes:
      - ./scripts/seed-db.sh:/scripts/seed-db.sh:ro
      - ./api/seed:/seed:ro
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      batches-migrate:
        condition: service_completed_successfully

  keycloak: # OIDC provider — realm JSON thuộc SF-4 (docker/keycloak/), password literal dev-only trong realm (KHÔNG env-substitution). SF-8: +client hubstore-admin (secret literal dev-only trong realm JSON, khớp KC_ADMIN_CLIENT_SECRET)
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "8081"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin} # dev-only default — overridable trong .env local, KHÔNG phải production secret
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    expose: ["8081"]

  # --- Kafka event bus (SF-27) — side-channel; profile 'kafka' → mặc định OFF,
  # bật: docker compose --profile kafka up. App services KHÔNG depends_on kafka
  # (spec §9.6: host-run E2E không thể phủ; kafka chết không chặn app).
  kafka: # apache/kafka KRaft combined — dual listener (host :9092, internal :29092)
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw # fixed 22-char base64 → format storage tự động
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init: # one-shot tạo 3 topics — pattern song song orders-migrate/batches-migrate
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    entrypoint: ["bash", "/scripts/init-topics.sh"]
    volumes:
      - ./docker/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui: # dev convenience only (SF-27) — :8085
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["kafka"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  fulfillment-service: # Java 17 gRPC :50051 (SF-3) — context root (pom ../../api/proto/gen/java)
    build:
      context: .
      dockerfile: services/fulfillment-service/Dockerfile
    environment:
      FULFILLMENT_DB_HOST: postgres
      FULFILLMENT_DB_PORT: "5432"
      FULFILLMENT_DB_NAME: fulfillment
      FULFILLMENT_DB_USER: ${POSTGRES_USER:-hubstore}
      FULFILLMENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092 # internal listener (host view = localhost:9092)
    depends_on:
      db-seed:
        condition: service_completed_successfully
    expose: ["50051"]

  batching-service: # Go gRPC :50052 (SF-4) — boot độc lập (KHÔNG depends fulfillment-service)
    build:
      context: .
      dockerfile: services/batching-service/Dockerfile
    environment:
      BATCHING_DB_HOST: postgres
      BATCHING_DB_PORT: "5432"
      BATCHING_DB_NAME: batching
      BATCHING_DB_USER: ${POSTGRES_USER:-hubstore}
      BATCHING_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      FULFILLMENT_ADDR: fulfillment-service:50051
      BATCHING_PORT: "50052"
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092 # internal listener (host view = localhost:9092)
    depends_on:
      db-seed:
        condition: service_completed_successfully
    expose: ["50052"]

  print-service: # Python gRPC :50053 (SF-5) — context root (_proto.py parents[3])
    build:
      context: .
      dockerfile: services/print-service/Dockerfile
    volumes:
      - ./api/seed:/seed:ro # printers registry load từ canonical seed (fail-fast nếu thiếu)
    expose: ["50053"]

  bff: # Node Fastify REST :8080 (SF-6)
    build:
      context: .
      dockerfile: services/bff-gateway/Dockerfile
    environment:
      JWT_DEV_SECRET: ${JWT_DEV_SECRET:?set JWT_DEV_SECRET in root .env}
      GRPC_FULFILLMENT: fulfillment-service:50051
      GRPC_BATCHING: batching-service:50052
      GRPC_PRINT: print-service:50053
      BFF_CORS_ORIGINS: http://localhost:3000
      OIDC_ISSUER: http://localhost:8081 # claim iss + browser redirect (public)
      OIDC_AUDIENCE: hubstore-api
      OIDC_JWKS_URL: http://keycloak:8081 # JWKS fetch trong network compose — URL riêng (gotcha Keycloak-in-Docker)
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-hubstore-admin} # SF-8 — Users management
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-hubstore-admin-dev-secret}
      ENABLE_DEV_RESET_PASSWORD: "1" # DEV-ONLY — bật /auth/reset-password (prod không set → 404)
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092 # internal listener (host view = localhost:9092)
      # SF-7 (FI-252): audit trail — BFF ghi activity_log trực tiếp DB fulfillment
      # (thêm của SF-7 trong scope compose của SF-1, additive-only)
      FULFILLMENT_DB_HOST: postgres
      FULFILLMENT_DB_PORT: "5432"
      FULFILLMENT_DB_NAME: fulfillment
      FULFILLMENT_DB_USER: ${POSTGRES_USER:-hubstore}
      FULFILLMENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
    depends_on:
      - fulfillment-service
      - batching-service
      - print-service
    expose: ["8080"]

  web: # nginx — shell + 2 remotes static + proxy /api → bff
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - bff

volumes:
  pgdata:
  kafka-data:
  keycloak-data:
    name: keycloak-data # name tường minh — scripts/reset-db.sh xóa đúng volume
