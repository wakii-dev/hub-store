# ⚠️ DEV-ONLY SECRETS — giá trị giả lập cho minikube local.
# KHÔNG BAO GIỜ dùng giá trị này ở môi trường thật. Secret thật = external (không commit).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: "hubstore"
  POSTGRES_PASSWORD: "dev-only-password"
  POSTGRES_DB: "hubstore"
---
# DEV-ONLY — khớp env JWT_DEV_SECRET mà services/bff-gateway/src/config.ts fail-loud đọc.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-dev-secret
type: Opaque
stringData:
  # PHẢI khớp VITE_JWT_DEV_SECRET trong root .env (spec §3.9: root .env là MỘT nguồn —
  # web image bake secret này lúc build; BFF verify secret này lúc runtime.
  # Sai lệch → BFF trả 401 cho mọi token UI — bug thật phát hiện ở SF-4 integration.
  JWT_DEV_SECRET: "7bff9f47ad0a956f70e92cf82da0b069ed9271f33cc31ea16163837ef6e49624"
---
# DEV-ONLY — Keycloak admin bootstrap (SF-3 sẽ consume; KC 26 dùng KC_BOOTSTRAP_ADMIN_*).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin-dev-only"
