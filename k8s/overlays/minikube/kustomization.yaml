# Overlay minikube — glue SF-4: tag images dev (khớp scripts/k8s-build-images.sh) +
# replica=1 mỗi service. SF-1 tạo skeleton; SF-5 thêm tune.
# KHÔNG dead-config: NodePort fallback là DOC ở SF-5, không config ở đây.
# CỐ TÌNH KHÔNG có commonLabels/labels: label transformer includeTemplates mutate
# template/volumeClaimTemplates của StatefulSet + Job SF-1 ĐÃ apply → kubectl apply
# re-run fail vĩnh viễn (spec forbidden/immutable) — phá ACCEPTANCE idempotent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: hub-store/fulfillment-service
    newTag: dev
  - name: hub-store/batching-service
    newTag: dev
  - name: hub-store/print-service
    newTag: dev
  - name: hub-store/bff-gateway
    newTag: dev
  - name: hub-store/web
    newTag: dev

replicas:
  - name: fulfillment
    count: 1
  - name: batching
    count: 1
  - name: print
    count: 1
  - name: bff
    count: 1
  - name: web
    count: 1
