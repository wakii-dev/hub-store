<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF-14 · Direction C — Master-detail split · Đối soát COD</title>
<style>
/* ═══ Tokens — mirror design-tokens.ts (SF-6 direction B, Modern SaaS Airy) ═══ */
:root{
  --primary:#EB6E09; --primary-hover:#F68A2E; --primary-active:#D96408;
  --primary-bg:#FEF6EE; --primary-border:#FDEADA;
  --primary-grad:linear-gradient(135deg,#F68A2E 0%,#EB6E09 60%,#D96408 100%);
  --text-strong:#101828; --text:#1D2939; --text-2:#344054; --text-muted:#667085; --text-faint:#98A2B3;
  --border:#D0D5DD; --divider:#EAECF0; --divider-soft:#F2F4F7;
  --bg:#F7F8FA; --white:#FFFFFF; --header-bg:#FBFCFD; --sidebar:#101828;
  --success:#039855; --success-bg:#ECFDF3; --success-line:#ABEFC6;
  --error:#D92D20; --error-bg:#FEF3F2; --error-line:#FECDCA;
  --warning:#B54708; --warning-bg:#FFFAEB; --warning-line:#FEDF89;
  --info:#1570EF; --info-bg:#EFF8FF; --info-line:#B2DDFF;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 6px 16px -4px rgba(16,24,40,.10),0 2px 6px -2px rgba(16,24,40,.06);
  --shadow-lg:0 20px 48px -12px rgba(16,24,40,.22);
  --shadow-primary:0 3px 10px rgba(235,110,9,.35);
  --r-sm:5px; --r-ctl:8px; --r-md:10px; --r-lg:12px; --r-card:16px; --r-pill:999px; --r-modal:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',-apple-system,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg)}

/* ═══ Shell chrome ═══ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--sidebar);display:flex;flex-direction:column;align-items:center;padding:10px 0;z-index:30}
.sidebar .logo{width:36px;height:36px;border-radius:10px;background:var(--primary-grad);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:var(--shadow-primary)}
.sidebar .nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#98A2B3;cursor:pointer;transition:all .13s ease;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:var(--primary-grad);color:#fff;box-shadow:var(--shadow-primary)}
.nav-item.active::after{content:'';position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:2px;background:var(--primary)}
.header{position:sticky;top:0;height:60px;background:var(--white);border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 88px;z-index:20}
.crumb{font-size:12.5px;color:var(--text-faint)}
.crumb b{color:var(--text-2);font-weight:600}
.header .right{display:flex;align-items:center;gap:16px}
.bell{width:34px;height:34px;border-radius:8px;border:1px solid var(--divider);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-muted);box-shadow:var(--shadow-xs);cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-grad);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ═══ Page ═══ */
.content{padding:20px 24px 40px 88px;max-width:1280px}
h1{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text-strong)}
.sub{font-size:13px;color:var(--text-muted);margin-top:3px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}

/* ═══ Split layout ═══ */
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.card{background:var(--white);border:1px solid var(--divider);border-radius:var(--r-card);box-shadow:var(--shadow-xs)}

/* ── Left: shop list ── */
.master{position:sticky;top:80px;overflow:hidden}
.master-head{padding:14px 16px 10px;border-bottom:1px solid var(--divider)}
.master-title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
.search input{width:100%;height:32px;border:1px solid var(--border);border-radius:var(--r-ctl);padding:0 10px 0 32px;font-size:13px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(235,110,9,.12)}
.period-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.period-line .pbox{flex:1;height:28px;border:1px solid var(--border);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-xs);font-size:12px;cursor:pointer}
.period-line .pbox:hover{border-color:var(--primary)}
.shop-list{max-height:560px;overflow-y:auto}
.shop-row{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--divider-soft);cursor:pointer;transition:background .12s ease;position:relative}
.shop-row:last-child{border-bottom:none}
.shop-row:hover{background:#FAFAFB}
.shop-row.sel{background:var(--primary-bg)}
.shop-row.sel::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--success)}
.dot.bad{background:var(--error)}
.dot.warn{background:var(--warning)}
.shop-row .info{flex:1;min-width:0}
.shop-row .name{font-size:13px;font-weight:600;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-row .meta{font-size:12px;color:var(--text-faint);margin-top:2px}
.shop-row .diff{text-align:right}
.shop-row .diff .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.shop-row .diff .v.neg{color:var(--error)}
.shop-row .diff .v.zero{color:var(--success);font-weight:500}
.shop-row .diff .c{font-size:11px;color:var(--text-faint)}
.master-foot{padding:10px 16px;border-top:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-faint)}

/* ── Right: detail ── */
.detail{overflow:hidden}
.detail-head{padding:18px 20px;border-bottom:1px solid var(--divider);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text-strong)}
.detail-head .code{font-size:12.5px;color:var(--text-faint);margin-top:2px}
.tag{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:3px 11px;font-size:12px;font-weight:500;border:1px solid;line-height:18px;white-space:nowrap}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:6px}
.tag.ok{color:var(--success);background:var(--success-bg);border-color:var(--success-line)}
.tag.bad{color:var(--error);background:var(--error-bg);border-color:var(--error-line)}
.tag.warn{color:var(--warning);background:var(--warning-bg);border-color:var(--warning-line)}

.dstats{display:flex;border-bottom:1px solid var(--divider)}
.dstat{flex:1;padding:14px 20px}
.dstat + .dstat{border-left:1px solid var(--divider)}
.dstat .l{font-size:12px;color:var(--text-muted)}
.dstat .v{font-size:17px;font-weight:700;color:var(--text-strong);margin-top:3px;font-variant-numeric:tabular-nums}
.dstat .v.neg{color:var(--error)}

.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--divider)}
.tab{padding:11px 2px;font-size:13.5px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .13s ease}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .cnt{font-size:11px;font-weight:600;background:var(--divider-soft);border-radius:999px;padding:1px 7px;margin-left:5px;color:var(--text-faint)}
.tab.on .cnt{background:var(--primary-bg);color:var(--primary)}

/* Order cards */
.orders{padding:14px 20px 20px;display:flex;flex-direction:column;gap:10px}
.order{display:flex;align-items:center;gap:16px;border:1px solid var(--divider);border-radius:var(--r-md);padding:12px 16px;transition:all .15s ease}
.order:hover{box-shadow:var(--shadow-sm);border-color:var(--border)}
.order .ocode{font-size:13.5px;font-weight:600;color:var(--text-strong)}
.order .ometa{font-size:12px;color:var(--text-faint);margin-top:2px}
.order .oamts{margin-left:auto;display:flex;gap:28px;text-align:right}
.order .oamts .l{font-size:11px;color:var(--text-faint)}
.order .oamts .v{font-size:13.5px;font-weight:600;color:var(--text-strong);font-variant-numeric:tabular-nums}
.order .oamts .v.miss{color:var(--text-faint);font-weight:400}
.order .oamts .v.short{color:var(--warning)}
.order .oact{width:128px;text-align:right}
.btn{height:32px;border-radius:var(--r-ctl);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:0 14px;transition:all .15s ease;font-family:inherit}
.btn-sm{height:26px;font-size:12px;padding:0 10px;border-radius:6px}
.btn-default{background:#fff;border:1px solid var(--divider);color:var(--text-2);box-shadow:var(--shadow-xs)}
.btn-default:hover{background:var(--divider-soft);border-color:var(--border)}
.btn-primary{background:var(--primary-grad);border:none;color:#fff;box-shadow:var(--shadow-primary)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{transform:translateY(1px)}
.link-btn{background:none;border:none;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px}
.link-btn:hover{color:var(--primary-hover);background:var(--primary-bg)}
.status-line{font-size:12px;font-weight:500}
.status-line.pending{color:var(--error)}
.status-line.mismatch{color:var(--warning)}
.status-line.confirmed{color:var(--success)}
.empty{padding:36px 20px;text-align:center;color:var(--text-faint);font-size:13px}
.empty svg{margin-bottom:10px}

/* ═══ Modal ═══ */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.modal{width:460px;background:#fff;border-radius:var(--r-modal);box-shadow:var(--shadow-lg);animation:modal-in .15s ease-out}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{padding:20px 24px 0;display:flex;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text-strong)}
.modal-x{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;padding:4px;border-radius:6px}
.modal-x:hover{background:var(--divider-soft)}
.modal-body{padding:16px 24px 4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .static{font-size:13.5px;padding:8px 0}
.field input{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-ctl);padding:0 12px;font-size:14px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(235,110,9,.12)}
.hint{font-size:12px;color:var(--text-faint);margin-top:6px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
  </div>
  <nav class="nav">
    <div class="nav-item" title="Trang chủ"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
    <div class="nav-item" title="Đơn hàng"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div>
    <div class="nav-item" title="Chuyến hoàn tất"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
    <div class="nav-item" title="Dashboard"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v-4"/><path d="M12 15V7"/><path d="M17 15v-7"/></svg></div>
    <div class="nav-item" title="Khu vực NV"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div class="nav-item active" title="Đối soát COD (Manager)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></div>
  </nav>
</aside>

<header class="header">
  <div class="crumb">Hub Store &nbsp;/&nbsp; <b>Đối soát COD</b></div>
  <div class="right">
    <div class="bell"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
    <div class="avatar">QL</div>
  </div>
</header>

<main class="content">
  <div class="page-head">
    <div>
      <h1>Đối soát COD</h1>
      <div class="sub">Chọn cửa hàng bên trái để xem chi tiết đơn · chỉ Manager / Admin</div>
    </div>
    <button class="btn btn-default" onclick="fakeExport(this)" style="height:34px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Xuất CSV kỳ này
    </button>
  </div>

  <div class="split">
    <!-- ══ MASTER: shop list ══ -->
    <div class="card master">
      <div class="master-head">
        <div class="master-title">Cửa hàng · kỳ đối soát</div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Tìm cửa hàng…" oninput="filterShops(this.value)">
        </div>
        <div class="period-line">
          <div class="pbox">01/09/2026</div>
          <span style="color:var(--text-faint)">→</span>
          <div class="pbox">30/09/2026</div>
        </div>
      </div>
      <div class="shop-list" id="shopList"></div>
      <div class="master-foot">
        <span>6 cửa hàng</span>
        <span>Tổng chênh lệch <b style="color:var(--error)">−2.750.000 ₫</b></span>
      </div>
    </div>

    <!-- ══ DETAIL: selected shop ══ -->
    <div class="card detail" id="detail"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Xác nhận thu COD</div>
      <button class="modal-x" onclick="closeConfirm()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Mã hoàn tất</label>
        <div class="static" id="m-code" style="font-weight:600">—</div>
      </div>
      <div class="field">
        <label>COD kỳ vọng (snapshot lúc hoàn tất)</label>
        <div class="static" id="m-expected">—</div>
      </div>
      <div class="field">
        <label>Số tiền thực thu</label>
        <input type="text" id="m-input" value="">
        <div class="hint">Để trống hoặc nhập 0 để lấy đúng số kỳ vọng. Actor ghi nhận: quanglm (Manager)</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-default" onclick="closeConfirm()">Hủy</button>
      <button class="btn btn-primary" onclick="doConfirm()">Xác nhận thu</button>
    </div>
  </div>
</div>

<script>
/* ═══ Mock data — aggregate rows (GROUP BY shop) + detail confirmations ═══ */
const SHOPS = [
  { code:'SHP-001', name:'FPT Shop Cầu Giấy', orders:128, expected:48600000, collected:47150000,
    status:'bad', statusLabel:'Thiếu thu',
    lech:[
      {code:'FLC-2026-0901-0034', time:'Hoàn tất 02/09 16:42', st:'pending', stLabel:'Chưa xác nhận thu', expected:450000, collected:null, by:null},
      {code:'FLC-2026-0901-0075', time:'Hoàn tất 03/09 08:30', st:'pending', stLabel:'Chưa xác nhận thu', expected:240000, collected:null, by:null},
      {code:'FLC-2026-0901-0102', time:'Hoàn tất 03/09 10:15', st:'pending', stLabel:'Chưa xác nhận thu', expected:720000, collected:null, by:null},
      {code:'FLC-2026-0902-0051', time:'Hoàn tất 03/09 14:05', st:'mismatch', stLabel:'Lệch số tiền', expected:320000, collected:280000, by:'nguyen.vt'},
    ]},
  { code:'SHP-002', name:'FPT Shop Hà Đông', orders:96, expected:36200000, collected:36200000,
    status:'ok', statusLabel:'Đủ', lech:[] },
  { code:'SHP-003', name:'FPT Shop Long Biên', orders:74, expected:27850000, collected:27750000,
    status:'warn', statusLabel:'Lệch tiền',
    lech:[
      {code:'FLC-2026-0902-0088', time:'Hoàn tất 01/09 18:20', st:'mismatch', stLabel:'Lệch số tiền', expected:240000, collected:200000, by:'tran.qa'},
      {code:'FLC-2026-0902-0113', time:'Hoàn tất 02/09 09:40', st:'mismatch', stLabel:'Lệch số tiền', expected:350000, collected:290000, by:'le.mh'},
    ]},
  { code:'SHP-004', name:'FPT Shop Thủ Đức', orders:152, expected:58400000, collected:58400000,
    status:'ok', statusLabel:'Đủ', lech:[] },
  { code:'SHP-005', name:'FPT Shop Bình Thạnh', orders:63, expected:21300000, collected:20100000,
    status:'bad', statusLabel:'Thiếu thu',
    lech:[
      {code:'FLC-2026-0903-0007', time:'Hoàn tất 02/09 15:30', st:'pending', stLabel:'Chưa xác nhận thu', expected:560000, collected:null, by:null},
      {code:'FLC-2026-0903-0012', time:'Hoàn tất 03/09 08:55', st:'pending', stLabel:'Chưa xác nhận thu', expected:290000, collected:null, by:null},
      {code:'FLC-2026-0903-0019', time:'Hoàn tất 03/09 11:22', st:'pending', stLabel:'Chưa xác nhận thu', expected:320000, collected:null, by:null},
      {code:'FLC-2026-0903-0021', time:'Hoàn tất 03/09 13:10', st:'mismatch', stLabel:'Lệch số tiền', expected:190000, collected:160000, by:'pham.dn'},
    ]},
  { code:'SHP-006', name:'FPT Shop Đà Nẵng', orders:41, expected:15750000, collected:15750000,
    status:'ok', statusLabel:'Đủ', lech:[] },
];
let selected = 'SHP-001';
let tab = 'lech';
const fmt = n => n.toLocaleString('vi-VN');
const diff = s => s.collected - s.expected;

function renderList(q = ''){
  const el = document.getElementById('shopList');
  el.innerHTML = SHOPS
    .filter(s => s.name.toLowerCase().includes(q.toLowerCase()) || s.code.toLowerCase().includes(q.toLowerCase()))
    .map(s => {
      const d = diff(s);
      return `<div class="shop-row ${s.code===selected?'sel':''}" onclick="select('${s.code}')">
        <span class="dot ${s.status}"></span>
        <div class="info"><div class="name">${s.name}</div><div class="meta">${s.code} · ${s.orders} đơn</div></div>
        <div class="diff"><div class="v ${d<0?'neg':'zero'}">${d===0?'Đủ':fmt(d)+' ₫'}</div><div class="c">${d===0?'':'thiếu'}</div></div>
      </div>`;
    }).join('');
}
function filterShops(q){ renderList(q); }
function select(code){ selected = code; tab = 'lech'; renderList(); renderDetail(); }

function renderDetail(){
  const s = SHOPS.find(x => x.code === selected);
  const d = diff(s);
  const lechEl = document.getElementById('detail');

  const stats = `
    <div class="dstats">
      <div class="dstat"><div class="l">Đơn hoàn tất</div><div class="v">${s.orders}</div></div>
      <div class="dstat"><div class="l">COD kỳ vọng</div><div class="v">${fmt(s.expected)} ₫</div></div>
      <div class="dstat"><div class="l">Đã thu</div><div class="v">${fmt(s.collected)} ₫</div></div>
      <div class="dstat"><div class="l">Chênh lệch</div><div class="v ${d<0?'neg':''}">${d===0?'0 ₫':'−'+fmt(-d)+' ₫'}</div></div>
    </div>`;

  const tag = `<span class="tag ${s.status}">${s.statusLabel}</span>`;

  if (s.lech.length === 0) {
    lechEl.innerHTML = `
      <div class="detail-head"><div><h2>${s.name}</h2><div class="code">${s.code}</div></div>${tag}</div>
      ${stats}
      <div class="empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <div>Đối soát sạch — mọi đơn COD của cửa hàng đã xác nhận đủ trong kỳ.</div>
      </div>`;
    return;
  }

  const shown = tab === 'lech' ? s.lech : ALL_ORDERS(s);
  const tabsHtml = `
    <div class="tabs">
      <div class="tab ${tab==='lech'?'on':''}" onclick="tab='lech';renderDetail()">Đơn lệch<span class="cnt">${s.lech.length}</span></div>
      <div class="tab ${tab==='all'?'on':''}" onclick="tab='all';renderDetail()">Tất cả đơn<span class="cnt">${s.orders}</span></div>
    </div>`;

  const ordersHtml = tab === 'lech'
    ? `<div class="orders">${s.lech.map(orderCard).join('')}</div>`
    : `<div class="empty" style="padding:28px">Mock rút gọn — tab "Tất cả đơn" gọi <b>GetSettlementDetail</b>, render cùng card template.</div>`;

  lechEl.innerHTML = `
    <div class="detail-head"><div><h2>${s.name}</h2><div class="code">${s.code}</div></div>${tag}</div>
    ${stats}
    ${tabsHtml}
    ${ordersHtml}`;
}

function ALL_ORDERS(s){ return s.lech; }

function orderCard(o){
  const pend = o.st === 'pending';
  const miss = pend;
  return `<div class="order" id="oc-${o.code}">
    <div>
      <div class="ocode">${o.code}</div>
      <div class="ometa">${o.time}${o.by ? ' · thu bởi ' + o.by : ''}</div>
    </div>
    <span class="status-line ${pend ? 'pending' : 'mismatch'}">● ${o.stLabel}</span>
    <div class="oamts">
      <div><div class="l">Kỳ vọng</div><div class="v">${fmt(o.expected)}</div></div>
      <div><div class="l">Thực thu</div><div class="v ${miss?'miss':(o.collected<o.expected?'short':'')}">${o.collected==null?'—':fmt(o.collected)}</div></div>
    </div>
    <div class="oact">${pend
      ? `<button class="btn btn-primary btn-sm" onclick="openConfirm('${o.code}',${o.expected})">Xác nhận thu</button>`
      : `<button class="link-btn" onclick="openConfirm('${o.code}',${o.expected},${o.collected})">Xác nhận lại</button>`}</div>
  </div>`;
}

function fakeExport(btn){
  const t = btn.innerHTML;
  btn.innerHTML = 'Đang xuất…';
  setTimeout(()=>{ btn.innerHTML = t; alert('Tải settlement_2026-09-01_2026-09-30.csv (demo)'); }, 700);
}
function openConfirm(code, expected, collected){
  document.getElementById('m-code').textContent = code;
  document.getElementById('m-expected').textContent = fmt(expected) + ' ₫';
  document.getElementById('m-input').value = fmt(collected ?? expected);
  document.getElementById('overlay').classList.add('show');
}
function closeConfirm(){ document.getElementById('overlay').classList.remove('show'); }
function doConfirm(){
  closeConfirm();
  /* Demo: remove card sau khi confirm (state thật sẽ refresh aggregate) */
  renderList(); renderDetail();
}
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeConfirm(); });
renderList(); renderDetail();
</script>
</body>
</html>
